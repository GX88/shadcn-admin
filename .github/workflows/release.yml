name: Build and Release

on:
  push:
    branches:
      - trea
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the project
        run: pnpm build

      - name: Create Release Package
        run: |
          cd dist
          tar -czvf ../shadcn-admin-dist.tar.gz .

      - name: Generate timestamp
        id: timestamp
        run: echo "TS=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: shadcn-admin-dist.tar.gz
          tag_name: release-${{ steps.timestamp.outputs.TS }}
          release_name: "Release ${{ steps.timestamp.outputs.TS }}"
          body: |
            ## 自动构建发布
            
            **构建时间**: ${{ steps.timestamp.outputs.TS }}
            **Commit**: ${{ github.sha }}
            **分支**: ${{ github.ref_name }}
            
            ### 下载说明
            下载 `shadcn-admin-dist.tar.gz` 并解压，将解压后的文件部署到 Web 服务器即可。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-admin-dist-${{ steps.timestamp.outputs.TS }}
          path: shadcn-admin-dist.tar.gz
          retention-days: 30
